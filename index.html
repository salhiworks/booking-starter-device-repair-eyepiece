<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pentalobe Device Repair — phone, tablet &amp; laptop repair in Cincinnati</title>
    <meta name="description" content="Independent phone, tablet and laptop repair in Over-the-Rhine, Cincinnati: screens, batteries, charging ports and diagnostics. One technician, written quotes. Book online." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pentalobe Device Repair — phone, tablet &amp; laptop repair in Cincinnati" />
    <meta property="og:description" content="Independent phone, tablet and laptop repair in Over-the-Rhine, Cincinnati: screens, batteries, charging ports and diagnostics. One technician, written quotes. Book online." />
    <meta name="theme-color" content="#eff1ef" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The first-screen photo (wide; phones get a 4:5 crop of the same frame).
         imagesizes must match HERO_SIZES in src/components/Hero.tsx. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      media="(min-width: 760px)"
      imagesrcset="/photos/hero-bench-960.avif 960w, /photos/hero-bench-1440.avif 1440w, /photos/hero-bench-1920.avif 1920w, /photos/hero-bench-2560.avif 2560w"
      imagesizes="(min-width: 1080px) min(58vw, 62rem), 100vw"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      type="image/avif"
      media="(max-width: 759.98px)"
      imagesrcset="/photos/hero-bench-phone-640.avif 640w, /photos/hero-bench-phone-960.avif 960w, /photos/hero-bench-phone-1280.avif 1280w"
      imagesizes="100vw"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
